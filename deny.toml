[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[advisories]
yanked = "deny"
ignore = [
  # Compile-time macro used by glycin-ng-rav1d; unmaintained, not vulnerable.
  { id = "RUSTSEC-2024-0436", reason = "build-time only proc macro pulled in by rav1d" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
